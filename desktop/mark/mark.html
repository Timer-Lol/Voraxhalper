<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Vorax Helper highlight</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
  .box { position: absolute; border: 3px solid #54c7b0; border-radius: 10px; box-shadow: 0 0 0 2px rgba(12,17,25,.75), 0 0 22px rgba(84,199,176,.75), inset 0 0 18px rgba(84,199,176,.35); animation: pulse 1.2s ease-in-out infinite; }
  .box.next { border-color: #e9ddc2; box-shadow: 0 0 0 2px rgba(12,17,25,.75), 0 0 26px rgba(233,221,194,.85), inset 0 0 18px rgba(233,221,194,.3); }
  .box.dim { opacity: .45; animation: none; }
  .chip { position: absolute; left: -12px; top: -12px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: #0c1119; border: 2px solid currentColor; color: #54c7b0; font: 800 13px/20px 'Segoe UI', system-ui, sans-serif; text-align: center; box-sizing: border-box; }
  .box.next .chip { color: #e9ddc2; }
  .lbl { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); white-space: nowrap; padding: 2px 8px; border-radius: 6px; background: rgba(12,17,25,.9); color: #e9ddc2; font: 600 12px/18px 'Segoe UI', system-ui, sans-serif; border: 1px solid #26344d; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 2px rgba(12,17,25,.75), 0 0 36px rgba(84,199,176,.95), inset 0 0 26px rgba(84,199,176,.45); } }
</style>
</head>
<body>
<script src="mark.js"></script>
</body>
</html>
