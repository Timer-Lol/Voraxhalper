<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Vorax Helper card</title>
<style>
  :root {
    --bg: #0c1119; --panel: #121b2a; --panel2: #16213a; --line: #26344d; --ink: #e9ddc2; --text: #c5cddb; --mute: #8190a8;
    --accent: #54c7b0; --warn: #e6b34a;
    --display: 'Archivo', 'Arial Black', 'Segoe UI Black', system-ui, sans-serif;
    --mono: 'JetBrains Mono', Consolas, ui-monospace, monospace;
    --body: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }
  html, body { margin: 0; background: transparent; color: var(--text); font: 13px/1.45 var(--body); overflow: hidden; user-select: none; }
  .card { margin: 6px; border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(180deg, rgba(22,33,58,.96), rgba(12,17,25,.96)); box-shadow: 0 10px 28px rgba(0,0,0,.45); overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 12px; border-bottom: 1px solid var(--line); cursor: move; -webkit-app-region: drag; } /* dragged by Windows itself, as Tartarus Overlay's card */
  .bar button { -webkit-app-region: no-drag; }
  .brand { font: 800 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
  .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .sp { flex: 1; }
  button { font: 600 11px/1 var(--body); color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--ink); }
  .body { padding: 10px 12px 12px; }
  .k { font: 500 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
  .move { font: 800 20px/1.1 var(--display); text-transform: uppercase; color: var(--accent); margin: 6px 0 4px; letter-spacing: .01em; }
  .detail { color: var(--text); }
  .others { margin-top: 10px; display: grid; gap: 4px; }
  .other { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--mute); border-top: 1px solid rgba(38,52,77,.6); padding-top: 4px; }
  .other b { font: 600 12px var(--mono); color: var(--text); white-space: nowrap; }
  .asks { margin-top: 10px; display: grid; gap: 3px; }
  .ask { color: var(--warn); font-size: 12px; }
  .clk { margin-top: 10px; font: 500 11px/1.4 var(--mono); color: var(--mute); border-top: 1px solid rgba(38,52,77,.6); padding-top: 6px; }
  .clk:empty { display: none; }
  .rep { margin-top: 10px; border-top: 1px solid rgba(38,52,77,.6); padding-top: 8px; display: grid; gap: 6px; }
  .rep[hidden] { display: none; }
  .rep .rt { font-size: 12px; color: var(--text); }
  .rep .rb { display: flex; gap: 8px; }
  button.primary { background: var(--accent); color: #0c1119; border-color: var(--accent); }
  .upd { display: none; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 200% 100%; animation: run 1.1s linear infinite; }
  .updating .upd { display: block; }
  @keyframes run { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .folded .body { display: none; }
  .folded .bar { border-bottom: 0; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="bar">
    <span class="brand">Vorax</span><span class="meta" id="meta">Waiting for the game</span><span class="sp"></span>
    <button id="snap" title="Read the board now (Ctrl+Alt+X)">Snap</button>
    <button id="open" title="Open the helper (Ctrl+Alt+H)">Helper</button>
    <button id="fold" title="Fold">–</button>
  </div>
  <div class="upd"></div>
  <div class="body">
    <div class="k" id="kicker">Next move</div>
    <div class="move" id="move">—</div>
    <div class="detail" id="detail">Start Surgical Preparation and the advice appears here.</div>
    <div class="others" id="others"></div>
    <div class="asks" id="asks"></div>
    <div class="clk" id="clk"></div>
    <div class="rep" id="rep" hidden>
      <div class="k">Debug report saved</div>
      <div class="rt" id="repText">Send it to the developer? It holds this run's pictures of the game window, what the helper read and advised, and its log.</div>
      <div class="rb"><button id="repSend" class="primary">Send</button><button id="repLook">Look first</button><button id="repNo">Not now</button></div>
    </div>
  </div>
</div>
<script src="overlay.js"></script>
</body>
</html>
