# Builds the Windows installer and attaches it to a GitHub release named after desktop/package.json's version
# (v1.0.0, ...). Runs when that version changes on main (or this file does), on a pushed v* tag, or by hand from the
# Actions tab. A release that already exists gets the new installer in place of the old one.
name: Release

on:
  push:
    branches: [main]
    paths: ['desktop/package.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: v
        shell: bash
        run: echo "tag=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install the app's parts
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build the installer
        working-directory: desktop
        run: npm run dist
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Vorax Helper ${{ steps.v.outputs.tag }}
          files: desktop/dist/Vorax-Helper-Setup.exe
          body: |
            Download **Vorax-Helper-Setup.exe** below and run it. It installs for your Windows user only (no administrator
            prompt) and adds a desktop and Start menu shortcut. Windows SmartScreen may warn that the installer isn't
            signed: click **More info → Run anyway**.

            Before your first game: in Torchlight: Infinite press Esc → Account Related → **Enable Log**, then log out and
            back in, and play windowed or borderless. See the README for hotkeys and settings.

            The helper only reads the game and advises; it never clicks or types in the game.
